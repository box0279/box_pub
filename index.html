<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box.pub | 问道记录</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.2.0/github-markdown-dark.min.css">
    <style>
        /* === 静谧水球风格 (Static Blue Orbs) === */
        body {
            margin: 0; padding: 0; min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex; justify-content: center; align-items: center;
            background-color: #0f172a; 
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.15) 0%, rgba(15, 23, 42, 0) 45%),
                radial-gradient(circle at 85% 80%, rgba(30, 64, 175, 0.25) 0%, rgba(15, 23, 42, 0) 50%),
                radial-gradient(circle at 40% 60%, rgba(99, 102, 241, 0.1) 0%, rgba(15, 23, 42, 0) 40%);
            background-attachment: fixed; background-repeat: no-repeat;
        }

        /* 主容器 */
        .glass-container {
            width: 100%; max-width: 1000px; 
            margin: 40px 20px;
            height: 85vh; 
            display: flex;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.6);
            overflow: hidden; 
        }

        /* 左侧菜单栏 */
        .sidebar {
            width: 250px;
            background: rgba(0, 0, 0, 0.2); 
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px; overflow-y: hidden; /* 改为hidden，让内部列表滚动 */
            display: flex; flex-direction: column;
        }
        
        .sidebar h3 {
            margin-top: 0; color: #bae6fd; font-size: 1.1rem; font-weight: 700;
            margin-bottom: 15px; letter-spacing: 1px;
        }

        /* === 新增：灵犀搜索框 === */
        .search-box {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 20px;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box; /* 确保不撑破容器 */
        }
        .search-box::placeholder { color: rgba(148, 163, 184, 0.5); }
        .search-box:focus {
            background: rgba(15, 23, 42, 0.6);
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }

        /* 菜单列表容器 (独立滚动) */
        #menu-list {
            flex: 1; overflow-y: auto; padding-right: 5px;
        }

        .menu-link {
            display: block; padding: 10px 15px; margin-bottom: 8px;
            color: #94a3b8; text-decoration: none; border-radius: 12px;
            transition: all 0.3s ease; font-size: 14px; cursor: pointer;
            word-break: break-all; border: 1px solid transparent;
        }
        .menu-link:hover, .menu-link.active {
            background: rgba(56, 189, 248, 0.1); color: #fff; 
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.1);
        }
        /* 隐藏的菜单项 */
        .menu-link.hidden { display: none; }

        /* 右侧内容区 */
        .content-area {
            flex: 1; padding: 40px; overflow-y: auto; scroll-behavior: smooth;
        }

        /* Markdown & 滚动条样式 (保持不变) */
        .markdown-body { background-color: transparent !important; }
        .markdown-body, .markdown-body p { color: #e2e8f0 !important; font-size: 16px; line-height: 1.8; }
        .markdown-body h1, .markdown-body h2 { color: #f0f9ff !important; border-bottom-color: rgba(255,255,255,0.1) !important; }
        .markdown-body a { color: #38bdf8 !important; text-decoration: none; border-bottom: 1px dashed rgba(56, 189, 248, 0.5); }
        .markdown-body a:hover { color: #7dd3fc !important; border-bottom-style: solid; }
        .markdown-body blockquote { border-left: 4px solid #0ea5e9 !important; background: rgba(14, 165, 233, 0.1) !important; padding: 10px 15px; color: #cbd5e0 !important; }
        .markdown-body pre, .markdown-body code.fenced-code { background-color: rgba(0,0,0,0.4) !important; border: 1px solid rgba(255,255,255,0.05); border-radius: 8px; }
        .markdown-body img {
            max-width: 100%; height: auto; display: block; margin: 16px auto;
            border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: zoom-in; background: rgba(0, 0, 0, 0.25);
        }
        .markdown-body .coin-pair {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 8px 0 28px;
        }
        .markdown-body .coin-pair figure { margin: 0; }
        .markdown-body .coin-pair img { width: 100%; margin: 0; }
        .markdown-body figcaption {
            text-align: center; color: #94a3b8 !important; font-size: 13px; margin-top: 8px;
        }
        .markdown-body .img-missing {
            min-height: 180px; display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px; border-radius: 12px;
            border: 1px dashed rgba(56, 189, 248, 0.35); color: #94a3b8 !important;
            background: rgba(15, 23, 42, 0.35);
        }
        .markdown-body th, .markdown-body td {
            color: #e2e8f0 !important; border-color: rgba(255, 255, 255, 0.1) !important;
        }
        .img-lightbox {
            position: fixed; inset: 0; z-index: 20; padding: 24px; cursor: zoom-out;
            display: flex; align-items: center; justify-content: center;
            background: rgba(2, 6, 23, 0.88);
        }
        .img-lightbox img {
            max-width: min(920px, 100%); max-height: 90vh; border-radius: 12px;
        }

        /* 手机适配 */
        @media (max-width: 768px) {
            body { align-items: flex-start; }
            .glass-container { flex-direction: column; height: auto; margin: 15px; max-width: 100%; }
            .sidebar { width: 100%; height: auto; max-height: none; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
            /* 手机上限制列表高度 */
            #menu-list { max-height: 200px; }
            .content-area { padding: 20px; height: auto; }
            .markdown-body .coin-pair { grid-template-columns: 1fr; }
        }

        .footer { text-align: center; margin-top: 50px; font-size: 12px; color: rgba(255,255,255,0.2); }
        #loading { text-align: center; color: #38bdf8; margin-top: 80px; font-weight: 500; letter-spacing: 2px; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.4); }
    </style>
</head>
<body>

    <div class="glass-container">
        <nav class="sidebar">
            <h3>💧 box的问道记录</h3>
            <input type="text" id="search-input" class="search-box" placeholder="🔍 搜索灵感...">
            <div id="menu-list">
                <div style="text-align:center; color:#64748b; margin-top:20px;">观象中...</div>
            </div>
        </nav>

        <main class="content-area">
            <article id="content" class="markdown-body">
                <div id="loading">← 请点选一篇，如观静水。</div>
            </article>
            <div class="footer">&copy; 2025 Box.pub | 问道不息</div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function() {
            const menuList = document.getElementById('menu-list');
            const contentDiv = document.getElementById('content');
            const searchInput = document.getElementById('search-input');
            let allLinks = [];

            contentDiv.addEventListener('click', (e) => {
                const img = e.target.closest('img');
                if (!img || !contentDiv.contains(img)) return;
                const overlay = document.createElement('div');
                overlay.className = 'img-lightbox';
                const full = document.createElement('img');
                full.src = img.currentSrc || img.src;
                full.alt = img.alt;
                overlay.appendChild(full);
                overlay.addEventListener('click', () => overlay.remove());
                document.body.appendChild(overlay);
            });

            function bindImages(root) {
                root.querySelectorAll('img').forEach(img => {
                    const markMissing = () => {
                        const note = document.createElement('div');
                        note.className = 'img-missing';
                        note.textContent = `${img.alt || '图片'} · 照片尚未放上`;
                        img.replaceWith(note);
                    };
                    img.addEventListener('error', markMissing);
                    if (img.complete && img.naturalWidth === 0) markMissing();
                });
            }

            async function loadArticle(filename) {
                contentDiv.innerHTML = '<div id="loading">正在展开...</div>';
                const encoded = encodeURIComponent(filename);
                const urls = [
                    encoded + '?v=' + Date.now(),
                    'https://raw.githubusercontent.com/box0279/box_pub/main/' + encoded
                ];
                let lastErr = null;
                for (const url of urls) {
                    try {
                        const res = await fetch(url);
                        if (!res.ok) throw new Error(res.status === 404 ? '找不到这篇文章' : ('HTTP ' + res.status));
                        const type = (res.headers.get('content-type') || '').toLowerCase();
                        const text = await res.text();
                        if (type.includes('text/html') || /^\s*<!doctype html/i.test(text)) {
                            throw new Error('找不到这篇文章');
                        }
                        contentDiv.innerHTML = marked.parse(text);
                        bindImages(contentDiv);
                        return;
                    } catch (err) {
                        lastErr = err;
                    }
                }
                contentDiv.innerHTML = `<div style="color:#fc8181; text-align:center;">读取失败<br>${lastErr ? lastErr.message : '未知错误'}</div>`;
            }

            function addLink(filename) {
                const link = document.createElement('a');
                link.className = 'menu-link';
                const title = filename.replace(/\.md$/, '');
                link.textContent = title;
                link.dataset.title = title.toLowerCase();
                link.dataset.filename = filename;
                link.href = '#';
                link.onclick = (e) => {
                    e.preventDefault();
                    loadArticle(filename);
                    allLinks.forEach(el => el.classList.remove('active'));
                    link.classList.add('active');
                };
                menuList.appendChild(link);
                allLinks.push(link);
                return link;
            }

            try {
                const response = await fetch('https://api.github.com/repos/box0279/box_pub/contents/');
                if (!response.ok) throw new Error("文章名单读取失败");
                const files = await response.json();
                const mdFiles = files.filter(file => file.type === 'file' && file.name.endsWith('.md')).map(file => file.name);

                menuList.innerHTML = '';
                if (mdFiles.length === 0) {
                    menuList.innerHTML = '<div>暂无记录</div>';
                    return;
                }

                mdFiles.forEach(addLink);
                const dated = mdFiles.filter(name => /^\d{8}/.test(name));
                const initial = dated.length ? dated[dated.length - 1] : mdFiles[mdFiles.length - 1];
                const active = allLinks.find(link => link.dataset.filename === initial);
                if (active) active.classList.add('active');
                loadArticle(initial);
            } catch (error) {
                menuList.innerHTML = `<div style="color:#fc8181; font-size:12px">无法加载<br>${error.message}</div>`;
            }

            searchInput.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase().trim();
                allLinks.forEach(link => {
                    if (link.dataset.title.includes(term)) {
                        link.classList.remove('hidden');
                    } else {
                        link.classList.add('hidden');
                    }
                });
            });
        });
    </script>
</body>
</html>
